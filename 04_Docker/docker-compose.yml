services:

  # ==========================================
  # BASE DE DATOS - POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16
    container_name: fet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: parqueadero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parqueadero"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - parqueadero-net


  # ==========================================
  # BROKER DE MENSAJERÍA - APACHE KAFKA
  # ==========================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: fet-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Dos listeners PLAINTEXT: uno para tráfico dentro de la red de Docker
      # (los demás contenedores resuelven "kafka"), otro para procesos que
      # corren en el host (ej. ./gradlew bootRun) y usan "localhost". Si solo
      # se anuncia "localhost", los contenedores reciben esa dirección en los
      # metadatos y no pueden completar la conexión real (cada contenedor
      # tiene su propio "localhost").
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    networks:
      - parqueadero-net


  # ==========================================
  # INICIALIZACIÓN DEL TÓPICO DE KAFKA
  # ==========================================
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: fet-kafka-init

    depends_on:
      - kafka

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        echo "Esperando a Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Kafka está disponible."

        echo "Creando tópico parqueadero.movimientos..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic parqueadero.movimientos \
          --partitions 3 \
          --replication-factor 1

        echo "Tópico parqueadero.movimientos creado correctamente."

    networks:
      - parqueadero-net


  # ==========================================
  # BACKEND - SPRING BOOT
  #
  # API REST + productor de eventos Kafka (tópico
  # parqueadero.movimientos). Ver ./backend/README.md
  # y ../03_Kafka/eventos.md.
  # ==========================================
  backend:
    build:
      # Un nivel arriba de 04_Docker/: backend/ es hermana de esta carpeta.
      context: ../backend
      dockerfile: Dockerfile

    container_name: fet-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parqueadero
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_started

    networks:
      - parqueadero-net


  # ==========================================
  # CONSUMIDOR DE AUDITORÍA
  #
  # Consume parqueadero.movimientos, valida,
  # evita duplicados por eventId y persiste en
  # AUDITORIA_EVENTOS. Ver ./auditoria-consumer/README.md
  # y ../03_Kafka/eventos.md.
  # ==========================================
  auditoria-consumer:
    build:
      # Un nivel arriba de 04_Docker/: auditoria-consumer/ es hermana de esta carpeta.
      context: ../auditoria-consumer
      dockerfile: Dockerfile

    container_name: fet-auditoria-consumer
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parqueadero
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: auditoria-group

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_started

    networks:
      - parqueadero-net


  # ── Kafka UI ───────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: omn-kafka-ui-local
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_READONLY=false
    depends_on:
      - kafka

    networks:
      - parqueadero-net


# ==========================================
# VOLUMEN DE POSTGRESQL
# ==========================================
volumes:
  postgres_data:


# ==========================================
# RED INTERNA DE LOS SERVICIOS
# ==========================================
networks:
  parqueadero-net:
    driver: bridge

